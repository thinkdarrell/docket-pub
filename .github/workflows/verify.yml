name: verify
on:
  push:
  pull_request:
    branches: [main]
jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: docket
          POSTGRES_PASSWORD: docket_dev
          POSTGRES_DB: docket_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U docket"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://docket:docket_dev@localhost:5432/docket_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
      - run: python -m venv venv && venv/bin/pip install -e ".[dev]"
      - run: ./tools/verify
