key: parking-fines
label: Parking fines ordinance
note: >-
  Held over a week for lack of unanimous consent. A sibling ordinance amending
  Title 8, Chapter 3, Section 8 travelled with it and followed the same route.
title: >-
  An Ordinance to amend Title 8, Chapter 3, Section 10, "Summary Disposition
  of Minor Traffic and Other Minor Offenses by Fine Schedule" to revise the
  fines for the summary disposition of municipal parking offenses, to add
  certain offenses previously omitted from the summary disposition schedule,
  and to provide for an administrative fee to cover certain expenses for
  tickets referred for collection.

stops:
  - stops: [submitted]
    record: none
    text: The agenda names the City Attorney as the submitter.
    gap: The submission date is not published.

  - stops: [committee]
    date: 2026-05-11
    record: committee_minutes
    meeting_id: 3142
    text: >-
      Transportation and Infrastructure Committee, item VI, "Parking Reform
      Update", presented by Christine Argo, Deputy Director of the Department
      of Transportation: raise parking fines by $10 across the board
      (unchanged since 2009) and add a $3 administrative fee for citations
      unpaid after 30 days. Councilors present: O'Quinn, Smith. The moment in
      the recording has not been located.
    quote: >-
      Councilor O'Quinn Motioned to Approve, including the amendment
      increasing the fine under Section 10-9-16(A) to $60 for commercial
      vehicles. Councilor Smith Seconded the Motion. Item Recommended to the
      City Council Agenda.
    source_file: committee-transportation-minutes-2026-05-11.txt
    document:
