key: consent-avondale-park
label: A routine contract on consent
note: >-
  An agreement of up to $4,000 for free events in Avondale Park, recommended to
  the consent agenda by the committee and listed there by the council. The
  resolution, as the committee's minutes print it:
title: >-
  A Resolution authorizing the Mayor to execute and deliver an agreement with
  Friends of Avondale Park, Inc. under which Friends of Avondale Park, Inc.
  shall provide free, family-friendly entertainment in a safe and welcoming
  setting for residents of all ages and backgrounds … the City shall pay
  Friends of Avondale Park, Inc. an amount not to exceed $4,000.

