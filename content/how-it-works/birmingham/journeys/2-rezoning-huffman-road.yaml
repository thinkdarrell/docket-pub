# One real item followed across the path: zoning case ZAC2026-08007, the
# rezoning of 1259 Huffman Road, 2026.
#
# Every date, tally and quotation on the page for this journey is written
# here; the page reads nothing but links from the database
# (`docket.services.how_it_works.resolve_journey`). The ids are production's
# `meetings.id` and `agenda_items.id`, read on 2026-11-12. No quotation here
