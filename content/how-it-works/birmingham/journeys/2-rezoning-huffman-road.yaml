# The same agenda item also exists in the database under a second, mislabelled
# meeting. That row is a copy of a council agenda, not a second appearance of
# the ordinance, and this file does not cite it.

key: rezoning-huffman-road
label: A rezoning with a split recommendation
note: >-
  Zoning case ZAC2026-08007: an ordinance to rezone 1259 Huffman Road from D-3
  Single-Family Residential to C-1 Neighborhood Commercial, for a new Boys &
  Girls Club of Central Alabama. The council's committee recommended it and the
  Zoning Advisory Committee did not; the council agenda prints both, in these
  words:
title: >-
  (Recommended by the Planning and Zoning Committee) (NOT Recommended by the
  ZAC)

